%YAML:1.0
# General sensor definitions.
camera_id: left_cam

# Sensor extrinsics wrt. the body-frame.
T_BS:
  cols: 4
  rows: 4
  data: [ 0, 0, 1, 0,
         -1, 0, 0, 0,
          0,-1, 0, 0.35,
          0, 0, 0, 1]

# ============== Camera specific definitions ==============
# Our frame rate fluctates between 37 and 44, which might cause issues
rate_hz: 40
resolution: [1280, 720]
camera_model: pinhole
intrinsics: [640, 640, 640, 360]

# No distortion is simulated, but put "radtan" to avoid a crash
distortion_model: radtan
distortion_coefficients: [0, 0, 0, 0, 0]

