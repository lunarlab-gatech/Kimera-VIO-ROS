%YAML:1.0

# ================== TRACKER PARAMETERS ================== 
# Window size used in the cv::calcOpticalFlowPyrLK function 
# to calculate optical flow using the Lucas-Kanade method
klt_win_size: 24

# The maximum number of iterations before termination cv::calcOpticalFlowPyrLK
klt_max_iter: 30

# The maximum number of "pyramid" levels to use
klt_max_level: 4

# Desired accuracy (which will cause termination when serach window moves
# by less than eps)
klt_eps: 0.1

# Maximum number of frames that a feature will be seen...
# Maybe we want to increase this, since our camera hz is higher?
maxFeatureAge: 25

# ================== Detector Parameters ================== 
# Feature to use, where:
#   0: FAST, 1: ORB, 2: AGAST, 3: GFTT, aka Good Features To Track
feature_detector_type: 3



maxFeaturesPerFrame: 300

# Good Features To Track specific parameters
quality_level: 0.001
min_distance: 20
block_size: 3
use_harris_detector: 0
k: 0.04

# FAST detector specific parameters [10, 20]
fast_thresh: 10

equalizeImage: 0
nominalBaseline: 0.11
toleranceTemplateMatching: 0.15
templ_cols: 101 #must be odd
templ_rows: 11
stripe_extra_rows: 0
minPointDist: 0.5
maxPointDist: 10
bidirectionalMatching: 0

# ================== Non-maximum suppression params ================== 
max_nr_keypoints_before_anms: 2000
enable_non_max_suppression: 1
non_max_suppression_type: 6
nr_horizontal_bins: 7
nr_vertical_bins: 5
binning_mask: []

# Subpixel corner refinement for the monocular case
enable_subpixel_corner_finder: 1
max_iters: 40
epsilon_error: 0.001
window_size: 10
zero_zone: -1

subpixelRefinementStereo: 0
useSuccessProbabilities: 1
useRANSAC: 1
minNrMonoInliers: 10
minNrStereoInliers: 5
ransac_threshold_mono: 1e-06
ransac_threshold_stereo: 1
ransac_use_1point_stereo: 1
ransac_use_2point_mono: 1
ransac_max_iterations: 100
ransac_probability: 0.995
ransac_randomize: 0
min_intra_keyframe_time: 0.2
max_intra_keyframe_time: 5.0
max_disparity_since_lkf: 1000 #large value to disable
minNumberFeatures: 0

# Since we're running a mono pipeline, this can't be enabled or we crash.
useStereoTracking: 0


disparityThreshold: 0.5
# Type of optical flow predictor to aid feature tracking:
# 0: Static - assumes no optical flow between images (aka static camera).
# 1: Rotational - use IMU gyro to estimate optical flow.
optical_flow_predictor_type: 1

# 2D-2D pose estimation method
use_2d2d_tracking: 1
2d2d_algorithm: 1 # Nister
optimize_2d2d_pose_from_inliers: 0

# 3D-3D pose estimation
use_3d3d_tracking: 1
optimize_3d3d_pose_from_inliers: 0

# 2D-3D pose estimation method
use_pnp_tracking: 0
pnp_algorithm: 3 # EPNP
min_pnp_inliers: 20
ransac_threshold_pnp: 1.0 # pixels
optimize_2d3d_pose_from_inliers: 0
