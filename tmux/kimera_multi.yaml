session_name: kimera_vio

environment:
  ROS_DIR: '/opt/ros/noetic'
  DATA_DIR: '/home/dbutterfield3/data/Kimera-Multi_Dataset/data/campus_tunnels_1207_compressed'
  ROS_WS: '/home/dbutterfield3/kimera_vio_ws'
  ROBOT_NAME: 'acl_jackal'
  BAG_DATE: '12_07'

options:
  default-command: /bin/bash

windows:
- window_name: main
  layout: tiled
  focus: true
  shell_command_before:
  - source $ROS_DIR/setup.bash
  - source $ROS_WS/devel/setup.bash
  panes:
  - roscore
  - shell_command:
    - sleep 8
    - roslaunch kimera_vio_ros kimera_vio_ros_kimera_multi.launch
  - shell_command:
    - sleep 15
    - rosbag play --clock $DATA_DIR/${BAG_DATE}_${ROBOT_NAME}.bag
  - shell_command:
    - sleep 10
    - rviz -d $(rospack find kimera_vio_ros)/rviz/kimera_vio_kimera_multi.rviz

- window_name: kill
  layout: tiled
  panes:
  - echo "tmux kill-session -t kimera_vio"